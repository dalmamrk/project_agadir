<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agadir Travel Hub</title>
    
    <!-- PWA Meta Tags for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Agadir Hub">
    
    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Local iOS Icon -->
    <link rel="apple-touch-icon" href="./icons/icon.svg">
    
    <!-- Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbar for a cleaner mobile app look */
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
        }
        header {
            padding-top: env(safe-area-inset-top);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans antialiased pb-10 selection:bg-amber-500 selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md px-6 pt-6 pb-4">
        <h1 class="text-2xl font-bold text-center tracking-tight">
            <span class="text-amber-400">Agadir</span> <span class="text-white">Travel Hub</span>
        </h1>
        <p class="text-xs text-slate-400 tracking-widest uppercase mt-1 text-center">🇲🇦 Marocco · Maggio 2026</p>
    </header>
    <div class="h-[2px] bg-gradient-to-r from-transparent via-amber-500 to-transparent"></div>

    <main class="p-4 space-y-6 max-w-md mx-auto mt-2">
        
        <!-- Mappa Section -->
        <section>
            <div class="rounded-3xl overflow-hidden border border-slate-700/50 shadow-[0_0_20px_rgba(245,158,11,0.08)]">
                <iframe src="https://www.google.com/maps/d/embed?mid=1MerBbwp4dfnI1EzsWorWqK-WfDjySqc&ehbc=2E312F" width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </section>

        <!-- Navigazione Rapida Section -->
        <section class="space-y-3">
            <p class="text-[11px] text-slate-500 uppercase tracking-widest font-medium px-1">Navigazione</p>
            <div class="grid grid-cols-2 gap-3">
                <a href="taghazout.html" class="flex items-center gap-3 p-4 bg-slate-800/60 hover:bg-slate-700/80 active:scale-[0.97] rounded-2xl border border-slate-700/50 transition-all duration-200">
                    <div class="w-[3px] h-8 rounded-full bg-sky-400"></div>
                    <span class="text-xl">🏄</span>
                    <span class="flex-1 font-medium text-sm text-slate-200">Taghazout</span>
                    <span class="text-slate-500 text-sm">→</span>
                </a>
                <a href="https://www.google.com/maps/dir/?api=1&destination=Aghroud" class="flex items-center gap-3 p-4 bg-slate-800/60 hover:bg-slate-700/80 active:scale-[0.97] rounded-2xl border border-slate-700/50 transition-all duration-200">
                    <div class="w-[3px] h-8 rounded-full bg-orange-400"></div>
                    <span class="text-xl">🏘️</span>
                    <span class="flex-1 font-medium text-sm text-slate-200">Aghroud</span>
                    <span class="text-slate-500 text-sm">→</span>
                </a>
                <a href="tamri-timlaline.html" class="flex items-center gap-3 p-4 bg-slate-800/60 hover:bg-slate-700/80 active:scale-[0.97] rounded-2xl border border-slate-700/50 transition-all duration-200">
                    <div class="w-[3px] h-8 rounded-full bg-amber-500"></div>
                    <span class="text-xl">🏂</span>
                    <span class="flex-1 font-medium text-sm text-slate-200">Tamri & Timlaline</span>
                    <span class="text-slate-500 text-sm">→</span>
                </a>
                <a href="paradise-valley.html" class="flex items-center gap-3 p-4 bg-slate-800/60 hover:bg-slate-700/80 active:scale-[0.97] rounded-2xl border border-slate-700/50 transition-all duration-200">
                    <div class="w-[3px] h-8 rounded-full bg-emerald-400"></div>
                    <span class="text-xl">🌴</span>
                    <span class="flex-1 font-medium text-sm text-slate-200">Paradise Valley</span>
                    <span class="text-slate-500 text-sm">→</span>
                </a>
            </div>
        </section>

        <!-- Convertitore Rapido Section -->
        <section class="space-y-2">
            <p class="text-[11px] text-slate-500 uppercase tracking-widest font-medium px-1">Euro → Dirham</p>
            <div class="grid grid-cols-4 gap-2">
                <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-3 text-center">
                    <p class="text-sm font-bold text-white">1€</p>
                    <p class="text-xs text-amber-400 mt-0.5">10.8</p>
                </div>
                <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-3 text-center">
                    <p class="text-sm font-bold text-white">5€</p>
                    <p class="text-xs text-amber-400 mt-0.5">54</p>
                </div>
                <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-3 text-center">
                    <p class="text-sm font-bold text-white">10€</p>
                    <p class="text-xs text-amber-400 mt-0.5">108</p>
                </div>
                <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-3 text-center">
                    <p class="text-sm font-bold text-white">50€</p>
                    <p class="text-xs text-amber-400 mt-0.5">540</p>
                </div>
            </div>
            <p class="text-[10px] text-slate-600 text-center">1€ = 10.8 MAD · tasso indicativo</p>
        </section>

    </main>

    <footer class="text-center py-6 text-[10px] text-slate-600">
        Agadir Travel Hub · 2026
    </footer>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('Service Worker registered with scope:', registration.scope);
                    })
                    .catch(error => {
                        console.error('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
